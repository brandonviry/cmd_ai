[graph]
all-features = false

[bans]
multiple-versions = "allow"
deny = [
  { name = "tokio" },
  { name = "async-std" },
  { name = "smol" },
  { name = "reqwest" },
  { name = "openssl" },
  { name = "openssl-sys" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0"]
confidence-threshold = 0.8
