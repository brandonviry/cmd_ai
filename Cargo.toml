[package]
name = "cmd_ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Agent TUI portable qui exécute des commandes shell à votre place"
license = "MIT"
repository = "https://github.com/brandonviry/cmd_ai"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cmd_ai"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lexopt = "0.3"
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags", "process-group"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
