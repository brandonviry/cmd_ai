# Constitution, principe II : une seule porte d'exécution.
# Seul src/exec.rs porte #[allow(clippy::disallowed_methods)].
disallowed-methods = [
  { path = "std::process::Command::new", reason = "toute création de processus passe par src/exec.rs" },
]
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
