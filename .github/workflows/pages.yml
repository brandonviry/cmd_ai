# Documentation site (constitution, "Documentation"): doc-site/ (Fumadocs) reads doc/ and bug/
# directly, is exported as static files and deployed to GitHub Pages.
# Repository settings: Pages > Build and deployment > Source = GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'bug/**'
      - 'doc-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pnpm version (packageManager of doc-site/package.json, else 10)
        id: pnpm
        run: |
          if jq -e '(.packageManager // "") | startswith("pnpm@")' doc-site/package.json > /dev/null; then
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=10" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: doc-site/package.json
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: doc-site/pnpm-lock.yaml
      - name: Configure Pages
        id: setup_pages
        uses: actions/configure-pages@v6
      - name: pnpm install
        working-directory: doc-site
        run: pnpm install --frozen-lockfile
      - name: pnpm build (static export)
        working-directory: doc-site
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.setup_pages.outputs.base_url }}
          # Google Search Console (URL-prefix property, HTML tag method): repository
          # variable GOOGLE_SITE_VERIFICATION = the token of the meta tag. Empty = no tag.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc-site/out

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
